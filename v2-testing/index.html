<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tempora Desktop</title>
        <style>
            body {
                margin: 0;
                overflow: hidden; /* Prevent scrollbars from appearing */
                font-family: Arial, sans-serif;
                color: #fff; /* Default text color for the page */
            }

            /* Styles for the fullscreen image */
            .fullscreen-image {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                object-fit: cover; /* Ensures the image covers the entire viewport */
                z-index: -1; /* Puts the image behind other content */
            }

            /* Styles for the search input container */
            #blurContainer {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                /* Initial state: hidden, transparent, no blur */
                opacity: 0;
                visibility: hidden; /* Use visibility for proper transition */
                background-color: rgba(0, 0, 0, 0.1);
                backdrop-filter: blur(0px);
                -webkit-backdrop-filter: blur(0px); /* For Safari */
                transition:
                    opacity 0.3s ease-out,
                    visibility 0.3s,
                    backdrop-filter 0.3s ease-out;
                z-index: 1;
            }

            /* State when search container is visible */
            #blurContainer.visible {
                opacity: 1 !important;
                visibility: visible !important;
                backdrop-filter: blur(25px);
                -webkit-backdrop-filter: blur(25px);
                transition-delay: 0s; /* Ensure container transitions immediately */
            }

            #searchContainer {
                position: fixed;
                top: 30%;
                left: 50%;
                transform: translate(-50%, -30%);
                opacity: inherit;
                width: 30vw;
                max-width: 90vw;
                padding: 15px 20px;
                transition: transform 0.3s ease-out;
                display: flex;
                align-items: center;
            }
            #searchInput {
                opacity: inherit;
                width: 30vw;
                max-width: 90vw;
                padding: 15px 20px;
                font-size: 1.3em;
                border: none;
                transition: transform 0.3s ease-out;
            }

            .inDeep {
                border-radius: 30px;
                background-color: rgba(255, 255, 255, 0.9);
                color: #333;
                outline: none; /* Remove outline on focus */
                box-shadow:
                    0 0 15px 5px rgba(0, 0, 0, 0.2),
                    inset 2px 2px 5px 2.5px rgba(0, 0, 0, 0.3);
                z-index: 11;
            }

            .outDeep {
                border-radius: 30px;
                background-color: rgba(255, 255, 255, 0.8);
                color: #333;
                outline: none; /* Remove outline on focus */
                box-shadow:
                    0 0 15px 5px rgba(0, 0, 0, 0.2),
                    inset 2px 2px 5px 2.5px rgba(255, 255, 255, 0.9),
                    inset -2px -2px 5px 2.5px rgba(0, 0, 0, 0.3);
                z-index: 11;
            }

            .icon {
                width: auto;
                height: 45px;
            }

            .metal-blur {
                background-color: rgba(255, 255, 255, 1);
                /*backdrop-filter: blur(25px);*/
            }

            #search-input::placeholder {
                color: #666;
            }

            #search-input:focus {
                background-color: #fff;
                box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.5); /* Blue glow on focus */
            }

            /* State for the input field when its parent container is visible */
            /*#searchContainer.visible {
                transform: translate(-50%, -50%);
                opacity: 1;
                transition-delay: 0.1s;
            }*/
        </style>
    </head>
    <body>
        <div id="desktop-container">
            <img
                src="../wallpapers/f16-flare.jpg"
                alt="Wallpaper"
                class="fullscreen-image"
            />
        </div>

        <div id="blurContainer">
            <div id="searchContainer" class="outDeep">
                <img src="search.png" class="icon" />
                <input
                    type="text"
                    id="searchInput"
                    class="inDeep"
                    placeholder="Type to search..."
                />
            </div>
        </div>

        <script>
            document.addEventListener("keydown", (event) => {
                const searchContainer =
                    document.getElementById("blurContainer");
                const searchInput = document.getElementById("searchContainer");

                // Check for Super (Meta) key and Spacebar
                // event.metaKey is true for the Command key on Mac and the Windows key on Windows
                if (event.code === "Space") {
                    event.preventDefault(); // Prevent default browser action (e.g., system search on some OS)

                    // Toggle 'visible' class
                    if (!searchContainer.classList.contains("visible")) {
                        searchContainer.classList.add("visible");
                        searchInput.focus(); // Automatically focus the input field when it appears
                    } else {
                        searchContainer.classList.remove("visible");
                        searchInput.blur(); // Remove focus when it hides
                        searchInput.value = ""; // Clear the input field when hidden
                    }
                } else if (
                    event.key === "Escape" &&
                    searchContainer.classList.contains("visible")
                ) {
                    // Optionally hide the search container when Escape is pressed
                    event.preventDefault();
                    searchContainer.classList.remove("visible");
                    searchInput.blur();
                    searchInput.value = "";
                }
            });
        </script>
    </body>
</html>
