$text_color = rgb(f5decc)
$background = rgb(2c2621)
$entry_border_color = rgb(12de52)
$font_family = Monaspace Xenon
$font_family_clock = Monaspace Radon
$font_material_symbols = Frolic-Filled

background {
    path = /home/austin/.config/ags/bing.jpg
    blur_size = 7
    blur_passes = 2
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.4
    outer_color = $entry_border_color
    inner_color = $background
    font_color = $text_color
    font_family = $font_family
    placeholder_text = Input password

    position = 0, 20
    halign = center
    valign = center
}

label { # Clock
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M%p")"
    color = $text_color
    font_size = 75
    font_family = $font_family_clock

    position = 0, 300
    halign = center
    valign = center
}

label { # Greeting
    monitor =
    text = Hi $USER
    color = $text_color
    font_size = 20
    font_family = $font_family

    position = 0, 220
    halign = center
    valign = center
}

label { # lock icon
    monitor =
    text = system-lock-screen
    shadow_passes = 1
    shadow_boost = 0.5
    color = $text_color
    font_size = 21
    font_family = $font_material_symbols

    position = 0, 65
    halign = center
    valign = bottom
}

label { # "locked" text
    monitor =
    text = locked
    shadow_passes = 1
    shadow_boost = 0.5
    color = $text_color
    font_size = 14
    font_family = $font_family

    position = 0, 45
    halign = center
    valign = bottom
}

label { # Status
    monitor =
    text = cmd[update:5000] /home/austin/.config/hypr/hyprlock/status.sh
    shadow_passes = 1
    shadow_boost = 0.5
    color = $text_color
    font_size = 14
    font_family = $font_family

    position = 30, -30
    halign = left
    valign = top
}