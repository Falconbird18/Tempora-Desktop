# Key Modifiers
# Physical Super key acts as Alt -> $mod
# Physical Ctrl key acts as Super -> $ctrl
# Physical Alt key acts as Ctrl -> $alt
$mod = SUPER
$ctrl = CTRL
$alt = ALT
$shift = SHIFT

# --- Media & System Control (No Modifiers Needed usually) ---
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle
bindl = $mod, XF86AudioMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle
bindl = $mod $shift, M, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0%
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 2%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindle = , XF86MonBrightnessUp, exec, brightnessctl set +2%
bindle = , XF86MonBrightnessDown, exec, brightnessctl set 2%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause

# --- Apps & Launchers ---
bind = $mod, T, exec, kitty
bind = $mod, E, exec, dolphin
bind = $mod, Space, global, quickshell:toggle-launcher
bind = $mod $shift, S, global, quickshell:screenshot-popup
bind = $mod, C, exec, hyprpicker -a
bind = $mod $shift, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mod, I, exec, XDG_CURRENT_DESKTOP="gnome" gnome-control-center
bind = $ctrl $shift, Escape, exec, gnome-system-monitor
bind = $mod $ctrl, L, exec, loginctl lock-session

# --- Window Management ---
bind = $mod, Q, killactive
bind = $mod, G, togglefloating
bind = $mod, F, fullscreen, 0
bind = $mod, D, fullscreen, 1
bind = $mod, P, pin

# Mouse Binds
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Focus
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Move Window
bind = $mod $ctrl, H, movewindow, l
bind = $mod $ctrl, L, movewindow, r
bind = $mod $ctrl, K, movewindow, u
bind = $mod $ctrl, J, movewindow, d

# --- Workspaces (Laptop: 1-10) ---
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod $ctrl, 1, movetoworkspace, 1
bind = $mod $ctrl, 2, movetoworkspace, 2
bind = $mod $ctrl, 3, movetoworkspace, 3
bind = $mod $ctrl, 4, movetoworkspace, 4
bind = $mod $ctrl, 5, movetoworkspace, 5
bind = $mod $ctrl, 6, movetoworkspace, 6
bind = $mod $ctrl, 7, movetoworkspace, 7
bind = $mod $ctrl, 8, movetoworkspace, 8
bind = $mod $ctrl, 9, movetoworkspace, 9
bind = $mod $ctrl, 0, movetoworkspace, 10

# --- Workspaces (External Monitor: 11-20) ---
bind = $mod $shift, 1, workspace, 11
bind = $mod $shift, 2, workspace, 12
bind = $mod $shift, 3, workspace, 13
bind = $mod $shift, 4, workspace, 14
bind = $mod $shift, 5, workspace, 15
bind = $mod $shift, 6, workspace, 16
bind = $mod $shift, 7, workspace, 17
bind = $mod $shift, 8, workspace, 18
bind = $mod $shift, 9, workspace, 19
bind = $mod $shift, 0, workspace, 20

bind = $mod $ctrl $shift, 1, movetoworkspace, 11
bind = $mod $ctrl $shift, 2, movetoworkspace, 12
bind = $mod $ctrl $shift, 3, movetoworkspace, 13
bind = $mod $ctrl $shift, 4, movetoworkspace, 14
bind = $mod $ctrl $shift, 5, movetoworkspace, 15
bind = $mod $ctrl $shift, 6, movetoworkspace, 16
bind = $mod $ctrl $shift, 7, movetoworkspace, 17
bind = $mod $ctrl $shift, 8, movetoworkspace, 18
bind = $mod $ctrl $shift, 9, movetoworkspace, 19
bind = $mod $ctrl $shift, 0, movetoworkspace, 20

# --- Navigation Exceptions Removed ---
bind = $mod, Right, workspace, +1
bind = $mod, Left, workspace, -1

# --- Submaps ---
bindr = $mod $shift, W, submap, noflee
submap = noflee
bindr = $mod $shift, W, submap, reset
submap = reset
