# exec = export SLURP_ARGS='-d -c 141D1FBB -b D8E1E444 -s 00000000'

general {
    col.active_border = rgb(DE6E12)
    col.inactive_border = rgb(12DE52)
    col.nogroup_border_active = rgb(DE6E12)
    col.nogroup_border = rgb(12DE52)
}

misc {
    background_color = rgba(FAF9F9FF)
}

decoration {
    rounding = 30
    rounding_power = 4.0
    active_opacity = 1
    inactive_opacity = 0.98
    dim_inactive = true
    dim_strength = 0.05

    blur {
	enabled = false
    }

    shadow {
    	enabled = false
    }
}


group {
    col.border_active = rgb(DE6E12)
    col.border_inactive = rgb(12DE52)

	groupbar {
	font_family = Monaspace Radon
	font_size = 18
	gradients = false
	height = 20
	indicator_height = 5
	rounding = 1
	col.active = rgb(DE6E12)
	col.inactive = rgb(12DE52)
	gaps_in = 4
	gaps_out = 5
	}

}

windowrulev2 = bordercolor rgb(DE6E12) rgba(DE6E1277),pinned:1
