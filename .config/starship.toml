format = """
[◖](fg:#E76EAB)$os$username[◗](bg:#E76EAB fg:#E76EAB)$directory[◗](fg:#E76EAB bg:#6E9BE7)$git_branch$git_status[◗](fg:#6E9BE7 bg:#6E9BE7)$c$elixir$elm$golang$gradle$haskell$java$julia$nodejs$nim$rust$scala[◗](fg:#6E9BE7 bg:#6E9BE7)$docker_context[◗](fg:#6E9BE7 bg:#6E9BE7)$time[◗ ](fg:#6E9BE7)"""

[username]
show_always = true
style_user = "bg:#E76EAB"
