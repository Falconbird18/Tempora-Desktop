## blurb: Auto-generated Frolic Light theme for Kitty terminal

#: The basic colors

foreground                      #562f10
background                      #f0edea
selection_foreground           #12de52
selection_background           #de6e12
background_opacity             1.0

#: Cursor colors

cursor                          #562f10
cursor_text_color              #f0edea

#: URL underline color when hovering with mouse

url_color                       #12de52

#: kitty window border colors and terminal bell colors

active_border_color             #de6e12
inactive_border_color          #12de52
bell_border_color              #de6e12
visual_bell_color              none

#: OS Window titlebar colors

wayland_titlebar_color         system
macos_titlebar_color          system

#: Tab bar colors

