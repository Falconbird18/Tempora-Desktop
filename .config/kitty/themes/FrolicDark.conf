## blurb: Auto-generated Frolic Dark theme for Kitty terminal

#: The basic colors

foreground                      #f5decc
background                      #2c2621
selection_foreground           #12de52
selection_background           #e06f12
background_opacity             1

#: Cursor colors

cursor                          #f5decc
cursor_text_color              #2c2621

#: URL underline color when hovering with mouse

url_color                       #12de52

#: kitty window border colors and terminal bell colors

active_border_color             #e06f12
inactive_border_color          #12de52
bell_border_color              #e06f12
visual_bell_color              none

#: OS Window titlebar colors

wayland_titlebar_color         system
macos_titlebar_color          system

#: Tab bar colors

active_tab_foreground         #f5decc
active_tab_background         #2c2621
inactive_tab_foreground       #12de52
inactive_tab_background       #2c2621
tab_bar_background           none
tab_bar_margin_color         none

