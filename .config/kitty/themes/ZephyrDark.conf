## blurb: Auto-generated Zephyr Dark theme for Kitty terminal

#: The basic colors

foreground                      #f5decc
background                      #505049
selection_foreground           #DE12D7
selection_background           #E0CB12
background_opacity             1

#: Cursor colors

cursor                          #f5decc
cursor_text_color              #505049

#: URL underline color when hovering with mouse

url_color                       #DE12D7

#: kitty window border colors and terminal bell colors

active_border_color             #E0CB12
inactive_border_color          #DE12D7
bell_border_color              #E0CB12
visual_bell_color              none

#: OS Window titlebar colors

wayland_titlebar_color         system
