## blurb: Auto-generated Verdant Dark theme for Kitty terminal

#: The basic colors

foreground                      #f5cced
background                      #50494f
selection_foreground           #12e0ac
selection_background           #e012ba
background_opacity             1.0

#: Cursor colors

cursor                          #f5cced
cursor_text_color              #50494f

#: URL underline color when hovering with mouse

url_color                       #12e0ac

#: kitty window border colors and terminal bell colors

active_border_color             #e012ba
inactive_border_color          #12e0ac
bell_border_color              #e012ba
visual_bell_color              none

#: OS Window titlebar colors

wayland_titlebar_color         system
macos_titlebar_color          system

#: Tab bar colors

active_tab_foreground         #f5cced
active_tab_background         #50494f
inactive_tab_foreground       #12e0ac
inactive_tab_background       #50494f
tab_bar_background           none
tab_bar_margin_color         none

